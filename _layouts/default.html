<!DOCTYPE html>
<html lang="{{ page.lang | default: 'zh' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — {{ site.description }}{% endif %}</title>
  <meta name="theme-color" content="#FBFAF7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16151A" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" href="{{ '/feed.xml' | relative_url }}" title="{{ site.title }}">
  {% seo %}
  <script>
    // 在样式应用前定妥主题，避免刷新时闪白
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <a href="{{ '/' | relative_url }}" class="brand">{{ site.title }}</a>
    <nav class="site-nav">
      <a href="{{ '/zh/' | relative_url }}"{% if page.lang == 'zh' and page.layout != 'post' %} aria-current="page"{% endif %}>中文</a>
      <a href="{{ '/ja/' | relative_url }}"{% if page.lang == 'ja' and page.layout != 'post' %} aria-current="page"{% endif %}>日本語</a>
      <button class="theme-toggle" type="button" id="theme-toggle" aria-label="切换深色 / 浅色主题" title="切换深色 / 浅色主题">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.5 14.3A8.5 8.5 0 0 1 9.7 3.5a8.5 8.5 0 1 0 10.8 10.8z"/>
        </svg>
      </button>
    </nav>
  </header>

  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <span>© {{ site.time | date: '%Y' }} {{ site.author }}</span>
    <span><a href="{{ '/feed.xml' | relative_url }}">RSS</a></span>
  </footer>

  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var root = document.documentElement;
        var current = root.getAttribute('data-theme');
        if (!current) {
          // 尚未手动指定：以系统当前值为准，切到相反的一侧
          current = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var next = current === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
