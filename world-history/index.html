{% raw %}<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>世界历史泳道</title>

<style>
/* 布局：一屏应用。顶栏（标题＋读数＋工具），下面整块是 canvas 泳道图；中国泳道固定在时间轴下方作参照；右侧抽屉看详情 */
:root{
  --bg:#f4f6f5; --surface:#ffffff; --sunk:#e9edeb; --line:#d3dad7; --fg:#1b2420; --muted:#5d6b65; --faint:#9aa7a1;
  --accent:#1f6f6b; --accent-soft:#d6ebe8; --pin:#eef6f4;
  --d-politics:#2f6aa3; --d-economy:#c27d0e; --d-money:#5f8f1f; --d-tech:#14918d; --d-culture:#8250c4; --d-war:#c42f4b; --d-society:#9a5f40;
  --t-spread:#14918d; --t-conquest:#c42f4b; --t-trade:#c27d0e; --t-migration:#9a5f40; --t-money:#5f8f1f; --t-diplomacy:#2f6aa3;
  --pol-l:84; --pol-s:30; --era:#dfe3e1; --ocean:#d7e6ec; --land:#ebe9e1; --grat:#c3d5dc; --border:rgb(30 40 36/.35);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
}

  --accent:#5cc2b9; --accent-soft:#1d3a37; --pin:#16211f;
  --d-politics:#6aa4e0; --d-economy:#e3a63c; --d-money:#93c255; --d-tech:#43c4bf; --d-culture:#b18cf0; --d-war:#ef6b83; --d-society:#cf9372;
  --t-spread:#43c4bf; --t-conquest:#ef6b83; --t-trade:#e3a63c; --t-migration:#cf9372; --t-money:#93c255; --t-diplomacy:#6aa4e0;
  --pol-l:27; --pol-s:24; --era:#26302d; color-scheme:dark}}
:root[data-theme="dark"]{
  --ocean:#0e1c23; --land:#252e2a; --grat:#1b2b33; --border:rgb(0 0 0/.55); --bg:#121816; --surface:#1a2220; --sunk:#202a27; --line:#2f3b37; --fg:#e4ebe8; --muted:#9aaba4; --faint:#5f6e68;

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);display:flex;flex-direction:column;overflow:hidden}
header{background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px 8px;

.gbar input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
#gyl{font-family:var(--serif);font-weight:800;font-size:16px;min-width:76px;font-variant-numeric:tabular-nums}

.chip[aria-pressed="false"] i{background:transparent;border:1.5px solid var(--c);width:5px;height:5px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 9px;cursor:pointer}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.search{position:relative}
#q{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 8px;width:170px}

main{flex:1;position:relative;min-height:0}

#cv.drag{cursor:grabbing}

.kicker{font-size:12px;color:var(--muted);letter-spacing:.06em;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dimtag{display:inline-flex;align-items:center;gap:4px;color:var(--c);font-weight:600}
.dimtag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
aside h2{font-family:var(--serif);font-size:22px;line-height:1.3;margin:6px 0 10px;text-wrap:balance}
aside h3{font-size:12px;color:var(--faint);letter-spacing:.1em;margin:20px 0 6px;font-weight:600}
aside p{line-height:1.75;margin:0 0 10px;font-size:14px}
.lead{font-size:15px;font-weight:500}
.databox{background:var(--sunk);border-radius:6px;padding:8px 10px;font-size:13px;line-height:1.6;font-variant-numeric:tabular-nums}
.src{font-size:12px;color:var(--muted);line-height:1.6}
.note{font-size:12.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:8px;line-height:1.6}
.list{display:grid;gap:2px}
.item{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:baseline;border:0;background:none;text-align:left;padding:5px 6px;border-radius:5px;cursor:pointer;font-size:13px;line-height:1.5}
.item:hover,.item:focus-visible{background:var(--sunk)}
.item .y{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px;white-space:nowrap}
.item .t{min-width:0}
.item .t em{font-style:normal;color:var(--muted)}
.slice-lane{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.slice-lane .ln{font-weight:600;font-size:13px}
.slice-lane .pol{color:var(--accent);font-size:13px;margin-left:6px}
.slice-lane .st{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.swatch{display:inline-block;width:14px;height:3px;border-radius:2px;background:var(--c);vertical-align:middle;margin-right:4px}
body.globe-on aside{bottom:57px}
footer{font-size:11.5px;color:var(--faint);padding-block:4px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;gap:14px;flex-wrap:wrap}
footer span{white-space:nowrap}
@media (max-width:640px){.tools{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin} .grp{flex-wrap:nowrap;flex:none} .search{flex:none} #results{position:fixed;top:120px;left:16px} #q{width:120px} h1{font-size:17px} .tools{font-size:12px} .hide-sm{display:none}
  aside{top:auto;height:62%;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:12px 12px 0 0;padding-bottom:max(28px,env(safe-area-inset-bottom,0px))}}
</style>

<body>


<header>
  <div class="top">
    <h1>世界历史泳道</h1>
    <div class="tabs" role="tablist"><button id="tabLane" role="tab" aria-selected="true">泳道</button><button id="tabGlobe" role="tab" aria-selected="false">地球仪</button></div>
    <div id="readout">移动鼠标查看某一年；点时间轴看「这一年的世界」</div>
  </div>
  <div class="tools">
    <div class="grp" id="dims" role="group" aria-label="维度"><span class="lbl">维度</span></div>
    <div class="grp"><span class="lbl">图层</span>
      <button class="btn" id="bLinks" aria-pressed="true" title="跨地区影响的弧线">影响</button>
      <button class="btn" id="bRoutes" aria-pressed="false" title="贸易路线与交流网络">路线</button>
      <select id="sStats" aria-label="数据曲线"><option value="">数据曲线：关</option><option value="pop">人口（对数）</option><option value="gdppc">人均 GDP（对数）</option></select>
      <select id="sTrace" aria-label="传播追踪"><option value="">追踪一样东西…</option></select>
    </div>
    <div class="grp"><span class="lbl">视图</span>
      <select id="sEra" aria-label="跳到时代">
        <option value="">跳到时代…</option>
        <option value="-3600,2030">全览</option>
        <option value="-3600,-1000">早期文明</option>
        <option value="-900,-150">轴心时代</option>
        <option value="-350,650">古典帝国</option>
        <option value="500,1500">中古</option>
        <option value="1200,1400">蒙古时代</option>
        <option value="1450,1800">大航海与近代早期</option>
        <option value="1780,1914">革命与工业化</option>
        <option value="1900,1950">两次世界大战</option>
        <option value="1945,2026">冷战与当代</option>
      </select>
      <select id="sScale" aria-label="时间刻度"><option value="hist">历史比例</option><option value="lin">等比例</option></select>
      <button class="btn" id="zIn" aria-label="放大">＋</button><button class="btn" id="zOut" aria-label="缩小">－</button>
      <button class="btn hide-sm" id="bCollapse">收起全部地区</button>
    </div>
    <div class="search"><input id="q" type="search" placeholder="搜事件、政权…" autocomplete="off" aria-label="搜索"><div id="results" hidden></div></div>
  </div>
</header>
<main id="stage">
  <canvas id="cv" tabindex="0" aria-label="世界历史泳道图"></canvas>
  <div id="loading">正在载入史料…</div>
  <div id="globe" hidden><canvas id="gl" aria-label="历史地球仪"></canvas>
    <div class="gnote"><span id="gSnap"></span><br>拖动旋转 · 滚轮或双指缩放 · 点疆域或事件看详情。疆域为近似，来自 <a href="https://github.com/aourednik/historical-basemaps" target="_blank" rel="noopener">historical-basemaps</a>（GPL-3.0）。为避免显示「未来」的疆域，总是取不晚于当前年份的最近切片。</div>
    <div class="gbar"><span id="gyl">—</span><button class="btn" id="gPrev" title="上一个疆域切片">◀</button><input id="gy" type="range" min="0" max="1000" step="0.5" aria-label="年份"><button class="btn" id="gNext" title="下一个疆域切片">▶</button><button class="btn" id="gPlay">▶ 播放</button></div></div>
  <aside id="panel" hidden></aside>
</main>
<footer id="foot"><span>拖动平移 · 滚轮上下翻 · Ctrl/⌘＋滚轮、双击或双指缩放 · 越放大越详细，影响弧线放大后出现 · 点事件看与它相关的影响 · 点空白处看那一年的世界</span><span id="stat"></span></footer>
<div id="tip" hidden></div>

<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s);
const cv=$("#cv"), ctx=cv.getContext("2d"), stage=$("#stage"), panel=$("#panel"), tip=$("#tip");
let D=null, T={}, W=0, H=0, dpr=1, LW=132;
const AXIS_H=34;
const S={k:1,u0:0,scroll:0,scale:"hist",dims:new Set(),links:true,routes:false,stats:"",trace:"",collapsed:new Set(),sel:null,slice:null,hoverX:null,flash:null,flashUntil:0};

/* ---------- 时间刻度：历史比例下越古越压缩 ---------- */
const BP=[-3600,-1000,-500,500,1500,1800,2030];
const WH=[0.04,0.07,0.1,0.12,0.3,0.6], WL=[1,1,1,1,1,1];
let WS=WH, CUM=[];
function setScale(m){S.scale=m;WS=m==="hist"?WH:WL;CUM=[0];for(let i=0;i<WS.length;i++)CUM.push(CUM[i]+(BP[i+1]-BP[i])*WS[i]);}
function U(y){if(y<=BP[0])return (y-BP[0])*WS[0];for(let i=0;i<WS.length;i++)if(y<=BP[i+1])return CUM[i]+(y-BP[i])*WS[i];return CUM[WS.length]+(y-BP[BP.length-1])*WS[WS.length-1];}
function YU(u){if(u<=0)return BP[0]+u/WS[0];for(let i=0;i<WS.length;i++)if(u<=CUM[i+1])return BP[i]+(u-CUM[i])/WS[i];return BP[BP.length-1]+(u-CUM[WS.length])/WS[WS.length-1];}
function wAt(y){for(let i=0;i<WS.length;i++)if(y<BP[i+1])return WS[i];return WS[WS.length-1];}
const X=y=>LW+(U(y)-S.u0)*S.k;
const yearAt=x=>YU((x-LW)/S.k+S.u0);
const dens=y=>S.k*wAt(y);
const UMAX=()=>CUM[WS.length];
function fit(a,b){const vw=W-LW;S.k=vw/(U(b)-U(a));S.u0=U(a);clampView();}
function kBounds(){const vw=W-LW;return [vw/(UMAX()*1.02),60/Math.min(...WS)*(S.scale==="hist"?0.6:1)];}
function clampView(){const [kmin,kmax]=kBounds();S.k=Math.min(kmax,Math.max(kmin,S.k));const vwU=(W-LW)/S.k;S.u0=Math.min(UMAX()-vwU*0.5,Math.max(-vwU*0.5,S.u0));}
function zoomAt(x,f){const uc=S.u0+(x-LW)/S.k;S.k*=f;clampView();S.u0=uc-(x-LW)/S.k;clampView();draw();}

/* ---------- 文字工具 ---------- */
const fy=(y,a)=>(a?"约":"")+(y<0?`前${-y}年`:`${y}年`);
const fr=(a,b,ap)=>b==null||b===a?fy(a,ap):`${fy(a,ap)}—${b<0?`前${-b}年`:`${b}年`}`;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MC=new Map();
function tw(t,font){const key=font+"|"+t;let w=MC.get(key);if(w==null){ctx.font=font;w=ctx.measureText(t).width;MC.set(key,w);}return w;}
const SANS='"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif';
const F=(s,b)=>`${b?"600 ":""}${s}px ${SANS}`;

/* ---------- 主题 ---------- */
function readTheme(){const cs=getComputedStyle(document.documentElement);const g=n=>cs.getPropertyValue(n).trim();
  T={bg:g("--bg"),surface:g("--surface"),sunk:g("--sunk"),line:g("--line"),fg:g("--fg"),muted:g("--muted"),faint:g("--faint"),accent:g("--accent"),accentSoft:g("--accent-soft"),pin:g("--pin"),era:g("--era"),polL:+g("--pol-l"),polS:+g("--pol-s"),dark:g("color-scheme")==="dark"||+g("--pol-l")<50};
  T.dim={};for(const d of ["politics","economy","money","tech","culture","war","society"])T.dim[d]=g("--d-"+d);
  T.type={};for(const t of ["spread","conquest","trade","migration","money","diplomacy"])T.type[t]=g("--t-"+t);
  if(D)colorPolities();}
const DIMNAME={politics:"政治与制度",economy:"经济与贸易",money:"货币与金融",tech:"技术与科学",culture:"文化宗教思想",war:"战争与军事",society:"人口与社会"};
const TYPENAME={spread:"传播",conquest:"征服与战争",trade:"贸易",migration:"迁移",money:"资金流动",diplomacy:"外交"};
const ROUTEC=["#b5651d","#2f6aa3","#8250c4","#14918d","#c42f4b","#5f8f1f","#9a5f40","#c27d0e"];

/* ---------- 数据准备 ---------- */
let SN={}, LANE={}, ORDER=[], REGION_OF={}, POL=[], EV=[], LK=[], TR=[], RT=[], ST={}, STR={}, LANEDATA={};
function prep(){
  for(const r of D.regions)for(const l of r.lanes){LANE[l.id]=l;REGION_OF[l.id]=r.id;}
  POL=D.polities;EV=D.events;LK=D.links;TR=D.traces||[];RT=(D.routes||[]).map((r,i)=>({...r,color:ROUTEC[i%ROUTEC.length]}));
  ST=(D.stats&&D.stats.values)||{};SN=(D.stats&&D.stats.notes)||{};
  for(const id in LANE)LANEDATA[id]={era:[],band:[],ev:[],rows:1,routes:[]};
  for(const p of POL){const L=LANEDATA[p.lane];if(!L)continue;(p.level===1?L.era:L.band).push(p);}
  for(const id in LANEDATA){const L=LANEDATA[id];L.band.sort((a,b)=>a.level-b.level||a.start-b.start);const ends=[];
    for(const p of L.band){let r=ends.findIndex(e=>e<=p.start);if(r<0){r=ends.length;if(r>=4)r=3;}ends[r]=Math.max(ends[r]??-1e9,p.end);p.row=r;}
